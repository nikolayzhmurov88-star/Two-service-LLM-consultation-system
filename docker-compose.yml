version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_service:
    build: ./auth_service
    ports:
      - "8000:8000"
    env_file:
      - ./auth_service/.env
    depends_on:
      - rabbitmq
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  bot_service:
    build: ./bot_service
    ports:
      - "8001:8000" 
    env_file:
      - ./bot_service/.env
    depends_on:
      - rabbitmq
      - redis
      - auth_service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    
  celery_worker:
    build: ./bot_service
    env_file:
      - ./bot_service/.env
    depends_on:
      - rabbitmq
      - redis
    command: celery -A app.infra.celery_app worker --loglevel=info --pool=prefork